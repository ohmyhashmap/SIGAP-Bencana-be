# SonarQube Project Configuration
sonar.projectKey=sigap-bencana-backend
sonar.projectName=sigap-bencana-backend

# Source & Test Code
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js

# File Encoding
sonar.sourceEncoding=UTF-8

# Coverage report (generated by Test stage before SonarQube runs)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude files that require a live DB/Redis from coverage measurement
sonar.coverage.exclusions=src/server.js,src/db/migrate.js,src/db/seed.js,src/routes/**,src/lib/auth.js

# Exclusions from duplication analysis
sonar.cpd.exclusions=**/*

# Exclusions from analysis entirely
sonar.exclusions=node_modules/**,coverage/**,**/*.sarif,latest-backend.zip

# Node.js max heap for scanner
sonar.javascript.node.maxspace=2048
