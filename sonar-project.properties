# SonarQube Project Configuration
sonar.projectKey=ohmyhashmap_SIGAP-Bencana-be
sonar.projectName=ohmyhashmap_SIGAP-Bencana-be

# Source & Test Code
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js

# File Encoding
sonar.sourceEncoding=UTF-8

# Coverage report (generated by Test stage before SonarQube runs)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude files that require a live DB/Redis/external API from coverage measurement.
# These files cannot be meaningfully unit-tested in CI without real infrastructure.
sonar.coverage.exclusions=\
  src/server.js,\
  src/db/**,\
  src/lib/auth.js,\
  src/lib/redis.js,\
  src/routes/**,\
  src/services/ai.js,\
  src/services/weather.js

# Exclusions from duplication analysis
sonar.cpd.exclusions=**/*

# Exclusions from analysis entirely (generated/vendor files)
sonar.exclusions=node_modules/**,coverage/**,**/*.sarif,latest-backend.zip

# Node.js max heap for scanner
sonar.javascript.node.maxspace=2048
